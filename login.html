<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7769ed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Duit">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon/Duit.png">
  <link rel="apple-touch-icon" href="icon/Duit.png">
  <title>Masuk - Duit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="login-brand" href="index.html" aria-label="Kembali ke Duit">
      <img class="login-brand-logo" src="icon/Duit.png" alt="Duit">
      <span>Duit</span>
    </a>

    <div class="auth-view" id="loginView">
      <div class="login-intro">
        <h1>Masuk ke akunmu</h1>
        <p>Kelola keuanganmu dengan lebih mudah.</p>
      </div>

      <form class="login-form" id="loginForm">
        <div class="field-group">
            <label for="email">Email atau username</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
            <input id="email" name="identifier" type="text" autocomplete="username" placeholder="nama@email.com atau username" required>
          </div>
        </div>

        <div class="field-group">
          <div class="field-label-row">
            <label for="password">Kata sandi</label>
            <a href="#lupa-kata-sandi" class="forgot-link">Lupa kata sandi?</a>
          </div>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v2"></path></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" minlength="6" required>
            <button type="button" class="password-toggle" data-password-target="password" aria-label="Tampilkan kata sandi" aria-pressed="false">
              <svg class="eye-open" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
              <svg class="eye-closed" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.7M6.2 6.3C3.9 7.7 2.5 12 2.5 12s3.5 6 9.5 6c1.2 0 2.3-.3 3.2-.7"></path></svg>
            </button>
          </div>
        </div>

        <label class="remember-me"><input type="checkbox" name="remember"><span class="custom-check"></span><span>Ingat saya</span></label>
        <button type="submit" class="login-button">Masuk</button>
      </form>

      <p class="login-footer">Belum punya akun? <a href="#signup" class="switch-auth" data-target="signup">Buat akun</a></p>
    </div>

    <div class="auth-view is-hidden" id="signupView">
      <div class="login-intro">
        <button type="button" class="back-to-login switch-auth" data-target="login">← Kembali ke login</button>
        <h1>Buat akun baru</h1>
        <p>Mulai rapikan keuanganmu bersama Duit.</p>
      </div>

      <form class="login-form signup-form" id="signupForm">
        <div class="field-group">
          <label for="signupUsername">Username</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
            <input id="signupUsername" name="username" type="text" autocomplete="username" placeholder="username kamu" minlength="3" maxlength="60" required>
          </div>
        </div>

        <div class="field-group">
          <label for="signupFullName">Nama lengkap</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 11a3 3 0 0 1 4.5 2.6M16.5 19h4"></path></svg>
            <input id="signupFullName" name="full_name" type="text" autocomplete="name" placeholder="nama lengkap" required>
          </div>
        </div>

        <div class="field-group">
          <label for="signupEmail">Alamat email</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
            <input id="signupEmail" name="email" type="email" autocomplete="email" placeholder="nama@email.com" required>
          </div>
        </div>

        <div class="field-group">
          <label for="signupPassword">Password</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v2"></path></svg>
            <input id="signupPassword" name="password" type="password" autocomplete="new-password" placeholder="minimal 6 karakter" minlength="6" required>
            <button type="button" class="password-toggle" data-password-target="signupPassword" aria-label="Tampilkan password" aria-pressed="false"><svg class="eye-open" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg><svg class="eye-closed" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.7M6.2 6.3C3.9 7.7 2.5 12 2.5 12s3.5 6 9.5 6c1.2 0 2.3-.3 3.2-.7"></path></svg></button>
          </div>
        </div>

        <div class="field-group">
          <label for="signupConfirmPassword">Confirm password</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v2"></path></svg>
            <input id="signupConfirmPassword" name="confirm_password" type="password" autocomplete="new-password" placeholder="ulangi password" minlength="6" required>
            <button type="button" class="password-toggle" data-password-target="signupConfirmPassword" aria-label="Tampilkan password" aria-pressed="false"><svg class="eye-open" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg><svg class="eye-closed" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.7M6.2 6.3C3.9 7.7 2.5 12 2.5 12s3.5 6 9.5 6c1.2 0 2.3-.3 3.2-.7"></path></svg></button>
          </div>
        </div>

        <button type="submit" class="login-button">Buat akun</button>
      </form>

      <p class="login-footer">Sudah punya akun? <a href="#login" class="switch-auth" data-target="login">Masuk di sini</a></p>
    </div>

    <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
